[package]
name = "starfishd"
version = "0.1.0"
edition = "2024"
authors = ["John Lyon-Smith <john@escapegallery.net>"]
repository = "https://github.com/jlyonsmith/starfish"
description = "Starfish user management server"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11.10"
lazy_static = "1.5.0"
log = { version = "0.4.32", features = ["serde"] }
serde = "1.0.228"
single-instance = "0.3.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
toml = "1.1.2"
url = { version = "2.5.8", features = ["serde"] }
rmp-serde = "1.3.1"
tokio-util = "0.7.18"
toasty = { version = "0.9.0", features = ["jiff", "postgresql"] }
jiff = "0.2.35"
starfish_db = { path = "../starfish_db" }
figment = { version = "0.10.19", features = ["toml"] }
serde_with = "3.22.0"

[[bin]]
name = "starfishd"
path = "src/main.rs"
