[package]
name = "starfish_db"
version = "0.1.0"
edition = "2024"

[features]
# Derives `tabled::Tabled` on the models, for `starfish_admin`'s table output.
# Off by default so `starfishd`, which never prints a table, does not build it.
tabled = ["dep:tabled"]

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.35"
tabled = { version = "0.22.0", optional = true }
toasty = { version = "0.9.0", features = ["postgresql", "jiff"] }
url = { version = "2.5.8", features = ["serde"] }
