[package]
name = "starfish_msg"
version = "0.1.0"
edition = "2024"
description = "Starfish wire protocol shared by the controller, agents and the admin tool"

[dependencies]
getrandom = "0.4.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "rt"] }
