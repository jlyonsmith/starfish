[package]
name = "starfish_admin"
version = "0.1.0"
edition = "2024"
description = "Starfish administration tool"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11.10"
futures-util = "0.3.32"
log = { version = "0.4.32", features = ["serde"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
rmp-serde = "1.3.1"
tokio-util = "0.7.18"
starfish_db = { path = "../starfish_db" }
toasty = { version = "0.9.0", features = ["postgresql", "jiff"] }
jiff = "0.2.35"
starfish_msg = { version = "0.1.0", path = "../starfish_msg" }

[[bin]]
name = "starfish-admin"
path = "src/main.rs"
